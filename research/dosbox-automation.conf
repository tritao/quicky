# Project-local DOSBox Automation configuration.
# The launcher supplies XDG_DATA_HOME as the repository root.

[cpu]
cpu_cycles = 16000
cpu_cycles_protected = auto
cpu_throttle = off

[webserver]
webserver_enabled = on
webserver_bind_address = 127.0.0.1
webserver_port = 8386
webserver_allow_remote = off
webserver_token_file = on
webserver_osd = on

# These values are read from the primary configuration for mount security.
mount_allowed_bases = $XDG_DATA_HOME/game
mount_allowed_image_roots = $XDG_DATA_HOME/game
